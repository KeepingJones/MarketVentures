name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-price-recon:
    name: price-recon tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: price-recon/requirements.txt
      - name: Install dependencies
        run: pip install -r price-recon/requirements.txt
      - name: Run tests
        working-directory: price-recon
        run: python -m pytest tests/ -v --tb=short

  test-alpha-pipeline:
